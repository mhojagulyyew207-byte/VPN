<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TIMOXVPN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font:14px Arial,sans-serif;min-height:100vh}.hidden{display:none!important}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:min(760px,100%);margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.logo{font-size:25px;font-weight:900}.logo span{color:#3b82f6}.top-actions{display:flex;gap:7px;align-items:center}.icon,.lang,.btn{border:1px solid #29292e;background:#121214;color:#fff;border-radius:9px;padding:9px 12px}.primary{background:#2563eb;border-color:#2563eb;font-weight:700}.danger{color:#ff586c!important}.green{color:#27d18b!important}.auth{min-height:88vh;display:grid;place-items:center}.auth-box{width:min(360px,100%);background:#0c0c0e;border:1px solid #242428;border-radius:18px;padding:26px}.auth-box h1{margin:0 0 5px}.muted{color:#8b8b95;font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#050505;padding:4px;border-radius:9px;margin:20px 0}.tabs button{border:0;background:transparent;color:#8b8b95;padding:10px;border-radius:7px}.tabs .on{background:#22242a;color:#fff}.form{display:grid;gap:12px}.field{display:grid;gap:6px;color:#aaa;font-size:12px}.input,.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:8px;border:1px solid #29292e;background:#121214;color:#fff;outline:0}.field input:focus,.field textarea:focus{border-color:#3b82f6}.error{color:#ff586c;font-size:12px}.dash-head{display:flex;justify-content:space-between;align-items:end;margin:12px 0 20px}.dash-head h1{margin:5px 0;font-size:30px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat,.section,.sub{background:#0c0c0e;border:1px solid #242428;border-radius:14px;padding:15px}.stat small{color:#999}.stat strong{display:block;font-size:25px;margin-top:13px}.section{margin-bottom:15px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-head h2{margin:0;font-size:19px}.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sub-title{display:flex;justify-content:space-between;gap:8px}.sub-title h3{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub p{color:#9696a0;font-size:12px;line-height:1.5}.badge{font-size:10px;white-space:nowrap;border-radius:6px;padding:5px 7px;background:#172e24;color:#27d18b}.badge.off{background:#35171d;color:#ff586c}.sub-url{display:flex;gap:5px;align-items:center;background:#050505;padding:7px;border-radius:7px}.sub-url code{font-size:10px;color:#a4a4ad;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions .btn{font-size:11px;padding:7px 9px}.requests{display:grid;gap:8px}.request{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #29292e;border-radius:9px}.request-name{flex:1}.request-name small{display:block;color:#999;margin-top:4px}.modal-bg{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:15px;z-index:5}.modal{width:min(700px,100%);max-height:94vh;overflow:auto;background:#0c0c0e;border:1px solid #29292e;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.limits{display:flex;gap:6px;flex-wrap:wrap}.limits button{border:1px solid #29292e;background:#121214;color:#aaa;padding:8px 10px;border-radius:7px}.limits button.on{background:#2563eb;border-color:#2563eb;color:#fff}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;right:15px;top:15px;background:#202532;border:1px solid #3b82f6;border-radius:9px;padding:11px;z-index:10;font-size:12px}@media(max-width:600px){.stats,.subs,.grid{grid-template-columns:1fr}.dash-head{align-items:start;gap:10px;flex-direction:column}.request{flex-wrap:wrap}.request .btn{flex:1}}
.loader{position:fixed;inset:0;background:#050505;z-index:20;display:grid;place-items:center;align-content:center;gap:14px;color:#fff}.loader-ring{width:48px;height:48px;border:4px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.auth-box{background:transparent;border:0}.auth-box h1{text-align:center;font-size:42px;margin:0 0 35px}.form .field{font-size:16px}.form .field input{padding:16px;border-radius:16px;font-size:17px}.form .btn.primary{padding:16px;border-radius:16px;font-size:17px}.tabs{display:none}.link-btn{border:0;background:transparent;color:#3b82f6;font-weight:700;margin-top:5px}.accounts{display:grid;gap:8px}.account-row{border:1px solid #29292e;border-radius:9px;padding:11px}.account-row strong{display:block}.account-row small{display:block;color:#999;margin-top:4px}@media(max-width:600px){.auth-box h1{font-size:32px}} </style></head><body><div id="loader" class="loader"><div class="loader-ring"></div><div>Yükleniyor...</div></div><div class="app">
<header class="top"><div class="logo"><span>TIMOX</span>VPN</div><div class="top-actions"><select id="language" class="lang"><option value="TR">TR</option><option value="TM">TM</option><option value="RU">RU</option><option value="EN">EN</option></select><button class="icon" onclick="toggleTheme()">◐</button></div></header>
<section id="auth" class="auth"><div class="auth-box"><h1 id="authTitle">Giriş yap</h1><p class="muted">Hesabınla TIMOXVPN paneline devam et.</p><div class="tabs"><button id="loginTab" class="on" onclick="switchAuth('login')">Login</button><button id="registerTab" onclick="switchAuth('register')">Register</button></div><form id="authForm" class="form" onsubmit="submitAuth(event)"><label class="field">Kullanıcı adı<input id="username" required minlength="4"></label><label class="field">Şifre<input id="password" type="password" required minlength="6"></label><div id="authError" class="error hidden"></div><button class="btn primary" id="authButton">Giriş yap</button></form><button id="switchLink" class="link-btn" type="button" onclick="switchAuth(mode==='login'?'register':'login')">Hesabınız yok mu? Kayıt ol</button><p class="muted" style="text-align:center">Kayıt olduktan sonra yönetici izni gerekir.</p></div></section>
<section id="dashboard" class="hidden"><div class="dash-head"><div><small class="muted">TIMOXVPN CONTROL PANEL</small><h1 id="hello">Panel</h1><span id="roleLine" class="muted"></span></div><button class="btn" onclick="logout()">Çıkış</button></div><div class="stats"><div class="stat"><small>Toplam abonelik</small><strong id="total">0</strong></div><div class="stat"><small>Aktif</small><strong id="active" class="green">0</strong></div><div class="stat"><small>Durum</small><strong id="permission">Bekliyor</strong></div></div><section class="section"><div class="section-head"><div><h2>Abonelikler</h2><span class="muted">HAPP profil bağlantılarını yönet</span></div><button id="createBtn" class="btn primary" onclick="openModal()">+ Abonelik oluştur</button></div><div id="accessBox" class="hidden"></div><div id="subs" class="subs"></div></section><section id="accountsSection" class="section hidden"><div class="section-head"><h2>Tüm hesaplar ve abonelikler</h2></div><div id="accounts" class="accounts"></div></section></section></div>
<div id="modalBg" class="modal-bg hidden"><div class="modal"><div class="section-head"><h2>Abonelik oluştur</h2><button class="icon" onclick="closeModal()">×</button></div><form class="form" onsubmit="saveSubscription(event)"><div class="grid"><label class="field">Abonelik adı<input id="sName" required placeholder="subscription"></label><label class="field">VPN adı<input id="vpnName" required placeholder="meniň vpnm"></label><label class="field">Açıklama<input id="description" placeholder="Güvenli VPN"></label><label class="field">Web-URL<input id="webUrl" type="url" placeholder="https://..."></label><label class="field">Profile-web-url<input id="profileWebUrl" type="url" placeholder="https://..."></label><label class="field">Güncelleme aralığı (1–24 saat)<input id="interval" type="number" min="1" max="24" value="1" required></label><label class="field">Bitecek zaman (1–30 gün)<input id="duration" type="number" min="1" max="30" value="30" required></label><label class="field">web-support<input id="supportUrl" type="url" placeholder="https://t.me/..."></label></div><label class="field">Limit<div id="limits" class="limits"><button type="button" data-limit="1">1GB</button><button type="button" data-limit="5">5GB</button><button type="button" data-limit="10">10GB</button><button type="button" data-limit="100">100GB</button><button type="button" data-limit="500">500GB</button><button type="button" data-limit="0">Limitsiz</button></div></label><label class="field">Bildiriş haty<input id="announce" placeholder="subscription"></label><label class="field">VLESS, VMess, Trojan, Hysteria veya SS kodları<textarea id="nodes" required rows="8" placeholder="vless://...&#10;vmess://...&#10;trojan://...&#10;hysteria://...&#10;ss://..."></textarea></label><div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">İptal</button><button class="btn primary">Kayıt et</button></div></form></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);let mode='login',editing=null,selectedLimit=1,current=null;localStorage.removeItem('timox_current');const db=JSON.parse(localStorage.getItem('timoxvpn_data')||'{"users":{},"subs":{},"requests":[]}');if(!db.users.rahym)db.users.rahym={password:'12344321',role:'admin'};else{db.users.rahym.password='12344321';db.users.rahym.role='admin'};
const tr={TR:{login:'Giriş yap',reg:'Register',create:'Abonelik oluştur',saved:'Kaydedildi'},TM:{login:'Giriş',reg:'Hasap aç',create:'Abunalyk döret',saved:'Ýatda saklandy'},RU:{login:'Войти',reg:'Регистрация',create:'Создать подписку',saved:'Сохранено'},EN:{login:'Login',reg:'Register',create:'Create subscription',saved:'Saved'}};
function persist(){localStorage.setItem('timoxvpn_data',JSON.stringify(db));if(current)localStorage.setItem('timox_current',current)}function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('language').onchange=()=>{localStorage.setItem('timox_lang',$('language').value);const t=tr[$('language').value];$('authTitle').textContent=mode==='login'?t.login:t.reg;$('authButton').textContent=mode==='login'?t.login:t.reg;$('loginTab').textContent=t.login;$('registerTab').textContent=t.reg};$('language').value=localStorage.getItem('timox_lang')||'TR';$('language').onchange();
function switchAuth(x){mode=x;$('loginTab').classList.toggle('on',x==='login');$('registerTab').classList.toggle('on',x==='register');$('switchLink').textContent=x==='login'?'Hesabınız yok mu? Kayıt ol':'Zaten hesabınız var mı? Giriş yap';$('language').onchange()}function submitAuth(e){e.preventDefault();const u=$('username').value.trim().toLowerCase(),p=$('password').value;if(mode==='register'){if(db.users[u])return fail('Bu kullanıcı zaten var.');db.users[u]={password:p,role:'user'};db.subs[u]=[];persist();current=u;showDash()}else{if(!db.users[u]||db.users[u].password!==p)return fail('Kullanıcı adı veya şifre hatalı.');current=u;persist();showDash()}}function fail(x){$('authError').textContent=x;$('authError').classList.remove('hidden')}
function showDash(){$('auth').classList.add('hidden');$('dashboard').classList.remove('hidden');render()}function logout(){current=null;localStorage.removeItem('timox_current');$('dashboard').classList.add('hidden');$('auth').classList.remove('hidden')}function toggleTheme(){document.body.classList.toggle('light');if(document.body.classList.contains('light')){document.body.style.background='#eef2f8';document.body.style.color='#15213a'}else location.reload()}
function allowed(){return Boolean(db.users[current])}function requestPermission(){if(!db.requests.some(r=>r.user===current&&r.status==='pending'))db.requests.push({id:Date.now(),user:current,days:30,status:'pending',created:Date.now()});persist();render();toast('İzin talebi gönderildi.')}function approve(id){const r=db.requests.find(x=>x.id===id);if(r)r.status='approved';persist();render()}function reject(id){const r=db.requests.find(x=>x.id===id);if(r)r.status='rejected';persist();render()}function removeRequest(id){db.requests=db.requests.filter(x=>x.id!==id);persist();render()}
function openModal(s){if(!allowed())return toast('Önce yönetici izni gerekli.');editing=s?.id||null;document.querySelector('#modalBg').classList.remove('hidden');document.querySelectorAll('#modalBg input,#modalBg textarea').forEach(x=>x.value='');selectedLimit=1;document.querySelectorAll('#limits button').forEach(x=>x.classList.remove('on'));document.querySelector('#limits button').classList.add('on');if(s){for(const [id,key] of [['sName','name'],['vpnName','vpnName'],['description','description'],['webUrl','webUrl'],['profileWebUrl','profileWebUrl'],['supportUrl','supportUrl'],['announce','announce'],['nodes','nodes']])$(id).value=s[key]||'';$('interval').value=s.interval;$('duration').value=s.duration;selectedLimit=s.limit;document.querySelector(`#limits button[data-limit="${s.limit}"]`)?.classList.add('on')}}function closeModal(){$('modalBg').classList.add('hidden')}document.querySelectorAll('#limits button').forEach(b=>b.onclick=()=>{selectedLimit=Number(b.dataset.limit);document.querySelectorAll('#limits button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
function saveSubscription(e){e.preventDefault();const s={id:editing||Date.now(),name:$('sName').value.trim(),vpnName:$('vpnName').value.trim(),description:$('description').value.trim(),webUrl:$('webUrl').value.trim(),profileWebUrl:$('profileWebUrl').value.trim(),supportUrl:$('supportUrl').value.trim(),announce:$('announce').value.trim(),interval:Number($('interval').value),duration:Number($('duration').value),limit:selectedLimit,nodes:$('nodes').value.trim(),enabled:true,created:Date.now()};const a=db.subs[current]||[],i=a.findIndex(x=>x.id===s.id);i>=0?a[i]=s:a.push(s);db.subs[current]=a;persist();closeModal();render();toast(tr[$('language').value].saved)}
function happ(s){const total=s.limit? s.limit*1073741824:0,expire=Math.floor((s.created+s.duration*86400000)/1000);return `#profile-title: ${s.name}\n#subscription-userinfo: upload=0; download=0; total=${total}; expire=${expire}\n#announce: ${s.announce}\n#support-url: ${s.supportUrl}\n#profile-web-page-url: ${s.profileWebUrl||s.webUrl}\n#profile-update-interval: ${s.interval}\n\n${s.enabled?s.nodes:'# Subscription disabled'}`}
function copy(s){navigator.clipboard?.writeText(happ(s));toast('HAPP kodu kopyalandı.')}function del(id){if(confirm('Bu abonelik silinsin mi?')){db.subs[current]=db.subs[current].filter(x=>x.id!==id);persist();render()}}function toggle(s){s.enabled=!s.enabled;persist();render();toast(s.enabled?'Abonelik açıldı.':'Subscription disabled')}
function render(){const u=db.users[current],a=db.subs[current]||[],ok=allowed();$('hello').textContent=current;$('roleLine').textContent=u.role==='admin'?'Yönetici':'Kullanıcı';$('total').textContent=a.length;$('active').textContent=a.filter(x=>x.enabled).length;$('permission').textContent='Aktif';$('permission').className='green';$('createBtn').disabled=!ok;$('accessBox').classList.toggle('hidden',ok||u.role==='admin');$('subs').innerHTML=a.length?a.map(s=>`<article class="sub"><div class="sub-title"><h3>${esc(s.name)}</h3><span class="badge ${s.enabled?'':'off'}">${s.enabled?'Aktif':'Kapalı'}</span></div><p>${esc(s.vpnName)} · ${s.limit?s.limit+'GB':'Limitsiz'} · ${s.duration} gün<br>${esc(s.description)}</p><div class="sub-url"><code>HAPP profili</code><button class="icon" onclick='copy(${JSON.stringify(s)})'>Kopyala</button></div><div class="actions"><button class="btn" onclick='openModal(${JSON.stringify(s)})'>Düzenle</button><button class="btn ${s.enabled?'danger':'green'}" onclick='toggle(${JSON.stringify(s)})'>${s.enabled?'Kapat':'Aç'}</button><button class="btn danger" onclick='del(${s.id})'>Sil</button></div></article>`).join(''):'<div class="muted">Henüz abonelik yok.</div>';if(u.role==='admin'){ $('accountsSection').classList.remove('hidden');$('accounts').innerHTML=Object.keys(db.users).map(name=>{const list=db.subs[name]||[];return `<div class="account-row"><strong>${esc(name)} ${db.users[name].role==='admin'?'· Yönetici':''}</strong><small>${list.length} abonelik: ${list.map(x=>esc(x.name)).join(', ')||'Yok'}</small></div>`}).join('')}}
setTimeout(()=>document.getElementById('loader').classList.add('hidden'),1500); $('auth').classList.remove('hidden');$('dashboard').classList.add('hidden');
</script></body></html>
