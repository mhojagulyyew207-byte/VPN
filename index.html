<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurkmenWix - Mağaza</title>
  <style>
    :root {
      --bg-color: #0f1016;
      --card-bg: #1a1b26;
      --text-color: #ffffff;
      --border-color: #2f3148;
      --accent-turkuaz: #00d2ff;
      --accent-white: #ffffff;
    }

    [data-theme="light"] {
      --bg-color: #f4f5f9;
      --card-bg: #ffffff;
      --text-color: #222222;
      --border-color: #d1d5db;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      transition: background 0.3s, color 0.3s;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-container {
      font-size: 24px;
      font-weight: bold;
    }
    .logo-turkmen { color: var(--accent-turkuaz); }
    .logo-wix { color: var(--accent-white); }
    [data-theme="light"] .logo-wix { color: #333; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Bakiye Kutusu */
    .balance-box {
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid var(--accent-turkuaz);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .add-balance-btn {
      background: var(--accent-turkuaz);
      color: #000;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls select, .theme-btn, .logout-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn { color: #ff4757; border-color: #ff4757; }

    /* Container */
    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
      text-align: center;
    }

    .auth-section {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin: 40px auto;
      width: 100%;
      max-width: 320px;
    }

    .auth-section input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .auth-section button {
      width: 90%;
      padding: 10px;
      margin-top: 10px;
      background: var(--accent-turkuaz);
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Mağaza İçeriği */
    #storeContent {
      display: none;
    }

    .ranks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .rank-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .rank-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-turkuaz);
    }

    .rank-name {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-turkuaz);
      margin-bottom: 5px;
    }

    .rank-price {
      font-size: 16px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .buy-rank-btn {
      background: #00ff88;
      color: #000;
      border: none;
      padding: 8px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    .user-info {
      font-size: 13px;
      margin-bottom: 10px;
      color: #888;
    }
  </style>
</head>
<body data-theme="dark">

  <header>
    <div class="logo-container">
      <span class="logo-turkmen">Turkmen</span><span class="logo-wix">Wix</span>
    </div>
    <div class="header-right">
      <div class="balance-box" id="headerBalanceBox" style="display: none;">
        <span id="userDisplay">Mıhman</span>: <span id="balanceAmount">0</span> TMT
        <button class="add-balance-btn" onclick="requestBalance()">+</button>
      </div>

      <div class="controls" style="display: flex; align-items: center; gap: 6px;">
        <select id="langSelect" onchange="changeLanguage()">
          <option value="tk">TM</option>
          <option value="tr">TR</option>
          <option value="az">AZ</option>
          <option value="uz">UZ</option>
          <option value="ru">RU</option>
          <option value="en">EN</option>
        </select>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        <button class="logout-btn" id="logoutBtn" onclick="logoutUser()" style="display: none;">Çykyş</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Giriş / Kayıt Alanı -->
    <div class="auth-section" id="authBox">
      <h3 id="authTitle">Giriş / Agza bol</h3>
      <div class="user-info" id="statusMsg">Ulgama girmek üçin maglumatlaryňyzy ýazyň</div>
      <input type="text" id="usernameInput" placeholder="Ulanyjy ady">
      <input type="password" id="passwordInput" placeholder="Aşakky söz (Şifre)">
      <button id="loginBtn" onclick="loginOrRegister()">Giriş / Agza bol</button>
    </div>

    <!-- Mağaza Alanı -->
    <div id="storeContent">
      <h2 id="storeTitle">Serwer Mağazasy</h2>
      <p style="font-size: 14px; opacity: 0.8;">IP: 172.96.140.62:5159</p>

      <div class="ranks-grid">
        <!-- Ranklar -->
        <div class="rank-card">
          <div class="rank-name">Fly</div>
          <div class="rank-price">5 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('Fly', 5)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">VIP</div>
          <div class="rank-price">10 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('VIP', 10)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">Creative</div>
          <div class="rank-price">20 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('Creative', 20)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">Meteo</div>
          <div class="rank-price">30 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('Meteo', 30)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">Admin</div>
          <div class="rank-price">50 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('Admin', 50)" class="buyBtnClass">Satyn al</button>
        </div>

        <!-- Özel Eşyalar & Paralar -->
        <div class="rank-card">
          <div class="rank-name">100k Sunucu Parasy</div>
          <div class="rank-price">5 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('100k Sunucu Parasy', 5)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">DC</div>
          <div class="rank-price">8 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('DC', 8)" class="buyBtnClass">Satyn al</button>
        </div>
        <div class="rank-card">
          <div class="rank-name">DCB</div>
          <div class="rank-price">50 TMT</div>
          <button class="buy-rank-btn" onclick="buyRank('DCB', 50)" class="buyBtnClass">Satyn al</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let users = {
      "rahym": { password: "qwerty654321", balance: 100 }
    };

    let loggedInUser = null;

    const translations = {
      tk: {
        authTitle: "Giriş / Agza bol",
        statusMsg: "Ulgama girmek üçin maglumatlaryňyzy ýazyň",
        usernamePlaceholder: "Ulanyjy ady",
        passwordPlaceholder: "Aşakky söz (Şifre)",
        loginBtn: "Giriş / Agza bol",
        storeTitle: "Serwer Mağazasy",
        buyBtn: "Satyn al",
        insufficient: "Balansyňyz ýetmezlik edýär!",
        enterNick: "Oýun içindäki adyňyzy (Nick) ýazyň:",
        successBuy: "Gutlaýarys! Üstünlikli satyn alyndy!",
        reqSent: "Balans haýyşy ugradyldy!",
        invalidAmount: "Dogry mukdar giriziň.",
        wrongPass: "Aşakky söz (Şifre) ýalňyş!",
        newUserCreated: "Täze ulanyjy döredildi we giriş edildi!",
        logout: "Çykyş"
      },
      tr: {
        authTitle: "Giriş Yap / Kayıt Ol",
        statusMsg: "Sisteme giriş yapmak için bilgilerinizi girin",
        usernamePlaceholder: "Kullanıcı Adı",
        passwordPlaceholder: "Şifre",
        loginBtn: "Giriş Yap / Kayıt Ol",
        storeTitle: "Sunucu Mağazası",
        buyBtn: "Satın Al",
        insufficient: "Yetersiz bakiye!",
        enterNick: "Oyun içi kullanıcı adınızı girin:",
        successBuy: "Tebrikler! Başarıyla satın alındı!",
        reqSent: "Bakiye talebi gönderildi!",
        invalidAmount: "Geçerli bir miktar girin.",
        wrongPass: "Hatalı şifre!",
        newUserCreated: "Yeni hesap oluşturuldu ve giriş yapıldı!",
        logout: "Çıkış"
      },
      az: {
        authTitle: "Giriş Et / Qeydiyyat",
        statusMsg: "Sistemə daxil olmaq üçün məlumatlarınızı daxil edin",
        usernamePlaceholder: "İstifadəçi adı",
        passwordPlaceholder: "Şifrə",
        loginBtn: "Daxil ol / Qeydiyyat",
        storeTitle: "Server Mağazası",
        buyBtn: "Al",
        insufficient: "Balansınız kifayət etmir!",
        enterNick: "Oyun içi ləqəbinizi daxil edin:",
        successBuy: "Təbriklər! Uğurla alındı!",
        reqSent: "Balans sorğusu göndərildi!",
        invalidAmount: "Düzgün məbləğ daxil edin.",
        wrongPass: "Yanlış şifrə!",
        newUserCreated: "Yeni hesab yaradıldı və daxil olundu!",
        logout: "Çıxış"
      },
      uz: {
        authTitle: "Kirish / Roʻyxatdan oʻtish",
        statusMsg: "Tizimga kirish uchun maʼlumotlaringizni kiriting",
        usernamePlaceholder: "Foydalanuvchi nomi",
        passwordPlaceholder: "Parol",
        loginBtn: "Kirish / Roʻyxatdan oʻtish",
        storeTitle: "Server Doʻkoni",
        buyBtn: "Sotib olish",
        insufficient: "Balansingiz yetarli emas!",
        enterNick: "Oʻyin ichidagi taxallusingizni kiriting:",
        successBuy: "Tabriklaymiz! Muvaffaqiyatli xarid qilindi!",
        reqSent: "Balans soʻrovi yuborildi!",
        invalidAmount: "Toʻgʻri miqdorni kiriting.",
        wrongPass: "Notoʻgʻri parol!",
        newUserCreated: "Yangi hisob yaratildi va tizimga kirildi!",
        logout: "Chiqish"
      },
      ru: {
        authTitle: "Вход / Регистрация",
        statusMsg: "Введите данные для входа в систему",
        usernamePlaceholder: "Имя пользователя",
        passwordPlaceholder: "Пароль",
        loginBtn: "Войти / Зарегистрироваться",
        storeTitle: "Магазин Сервера",
        buyBtn: "Купить",
        insufficient: "Недостаточно баланса!",
        enterNick: "Введите ваш игровой ник:",
        successBuy: "Поздравляем! Успешно куплено!",
        reqSent: "Запрос отправлен!",
        invalidAmount: "Введите корректную сумму.",
        wrongPass: "Неверный пароль!",
        newUserCreated: "Новый аккаунт создан и выполнен вход!",
        logout: "Выход"
      },
      en: {
        authTitle: "Login / Register",
        statusMsg: "Enter your credentials to log in",
        usernamePlaceholder: "Username",
        passwordPlaceholder: "Password",
        loginBtn: "Login / Register",
        storeTitle: "Server Store",
        buyBtn: "Buy Now",
        insufficient: "Insufficient balance!",
        enterNick: "Enter your in-game nickname:",
        successBuy: "Congratulations! Successfully purchased!",
        reqSent: "Balance request sent!",
        invalidAmount: "Enter a valid amount.",
        wrongPass: "Incorrect password!",
        newUserCreated: "New account created and logged in!",
        logout: "Logout"
      }
    };

    let currentLang = "tk";

    function loginOrRegister() {
      const uInput = document.getElementById('usernameInput').value.trim();
      const pInput = document.getElementById('passwordInput').value.trim();
      const t = translations[currentLang];

      if (!uInput || !pInput) {
        alert(t.statusMsg);
        return;
      }

      const lowerU = uInput.toLowerCase();

      if (users[lowerU]) {
        if (users[lowerU].password === pInput) {
          loggedInUser = lowerU;
        } else {
          alert(t.wrongPass);
          return;
        }
      } else {
        users[lowerU] = { password: pInput, balance: 0 };
        loggedInUser = lowerU;
        alert(t.newUserCreated);
      }

      document.getElementById('authBox').style.display = "none";
      document.getElementById('storeContent').style.display = "block";
      document.getElementById('headerBalanceBox').style.display = "flex";
      document.getElementById('logoutBtn').style.display = "inline-block";

      updateUI();
    }

    function logoutUser() {
      loggedInUser = null;
      document.getElementById('authBox').style.display = "block";
      document.getElementById('storeContent').style.display = "none";
      document.getElementById('headerBalanceBox').style.display = "none";
      document.getElementById('logoutBtn').style.display = "none";
      document.getElementById('usernameInput').value = "";
      document.getElementById('passwordInput').value = "";
    }

    function updateUI() {
      if (!loggedInUser) return;
      document.getElementById('userDisplay').innerText = loggedInUser;
      document.getElementById('balanceAmount').innerText = users[loggedInUser].balance;
    }

    function requestBalance() {
      const t = translations[currentLang];
      let amount = prompt("TMT:");
      amount = parseInt(amount);

      if (amount && amount > 0) {
        users[loggedInUser].balance += amount;
        alert(t.reqSent);
        updateUI();
      } else {
        alert(t.invalidAmount);
      }
    }

    function buyRank(rankName, price) {
      const t = translations[currentLang];

      if (users[loggedInUser].balance < price) {
        alert(t.insufficient);
        return;
      }

      let ingameName = prompt(t.enterNick);
      if (!ingameName) return;

      users[loggedInUser].balance -= price;
      updateUI();

      alert(`${t.successBuy}\nNick: ${ingameName}\nÜrün: ${rankName}`);
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeBtn');
      if (body.getAttribute("data-theme") === "dark") {
        body.setAttribute("data-theme", "light");
        themeBtn.innerText = "☀️";
      } else {
        body.setAttribute("data-theme", "dark");
        themeBtn.innerText = "🌙";
      }
    }

    function changeLanguage() {
      currentLang = document.getElementById('langSelect').value;
      const t = translations[currentLang];

      document.getElementById('authTitle').innerText = t.authTitle;
      document.getElementById('statusMsg').innerText = t.statusMsg;
      document.getElementById('usernameInput').placeholder = t.usernamePlaceholder;
      document.getElementById('passwordInput').placeholder = t.passwordPlaceholder;
      document.getElementById('loginBtn').innerText = t.loginBtn;
      document.getElementById('storeTitle').innerText = t.storeTitle;
      document.getElementById('logoutBtn').innerText = t.logout;

      let buyButtons = document.querySelectorAll('.buy-rank-btn');
      buyButtons.forEach(btn => {
        btn.innerText = t.buyBtn;
      });
    }
  </script>
</body>
</html>
