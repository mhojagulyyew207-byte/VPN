<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurkmenWix Mağazasy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            color: #00ffcc;
        }
        .product {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .product button:hover {
            background: #00b386;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #333;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        .admin-section, .orders-section {
            margin-top: 30px;
            background: #252525;
            padding: 15px;
            border-radius: 5px;
        }
        .order-item {
            background: #333;
            padding: 10px;
            margin-top: 5px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #ff4444 !important;
            color: white !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TurkmenWix Mağazasy</h1>
    
    <div id="shop-section">
        <h2>Önümler</h2>
        <input type="text" id="player-name" placeholder="Oýunçy adyňyzy ýazyň (Nick)">
        
        <div class="product">
            <div><strong>100k Sunucu Parasy</strong><br>Bahasy: 5 TMT</div>
            <button onclick="buyItem('100k Sunucu Parasy', 5)">Satyn al</button>
        </div>
        <div class="product">
            <div><strong>DC Parasy</strong><br>Bahasy: 8 TMT</div>
            <button onclick="buyItem('DC Parasy', 8)">Satyn al</button>
        </div>
        <div class="product">
            <div><strong>DCB</strong><br>Bahasy: 50 TMT</div>
            <button onclick="buyItem('DCB', 50)">Satyn al</button>
        </div>
    </div>

    <div class="orders-section">
        <h2>Sargytlarym / Status</h2>
        <div id="orders-list">Hiç hili sargyt ýok.</div>
    </div>

    <div class="admin-section">
        <h2>Admin Panel</h2>
        <div id="admin-login-box">
            <input type="password" id="admin-pass" placeholder="Admin açar sözüni ýazyň">
            <button onclick="adminLogin()" style="background:#00ffcc; color:#000; border:none; padding:10px; width:100%; border-radius:5px; font-weight:bold; cursor:pointer;">Giriş Et</button>
        </div>
        <div id="admin-panel-content" style="display:none;">
            <p style="color: #00ffcc;">Admin hökmünde girdiňiz!</p>
            <h3>Ähli Sargytlar (Dolandyryş)</h3>
            <div id="admin-orders-list"></div>
        </div>
    </div>
</div>

<script>
    let orders = JSON.parse(localStorage.getItem('turkmenwix_orders')) || [];
    let isAdmin = false;

    function saveOrders() {
        localStorage.setItem('turkmenwix_orders', JSON.stringify(orders));
        renderOrders();
    }

    function buyItem(itemNama, price) {
        let playerName = document.getElementById('player-name').value.trim();
        if(!playerName) {
            alert('Ilki bilen oýunçy adyňyzy ýazyň!');
            return;
        }

        let newOrder = {
            id: Date.now(),
            player: playerName,
            item: itemNama,
            price: price,
            status: 'Garaşylýar'
        };

        orders.push(newOrder);
        saveOrders();
        alert('Sargyt üstünlikli berildi!');
        document.getElementById('player-name').value = '';
    }

    function cancelOrder(id) {
        orders = orders.filter(o => o.id !== id);
        saveOrders();
    }

    function renderOrders() {
        let listDiv = document.getElementById('orders-list');
        let adminListDiv = document.getElementById('admin-orders-list');
        
        if(orders.length === 0) {
            listDiv.innerHTML = 'Hiç hili sargyt ýok.';
            adminListDiv.innerHTML = 'Hiç hili sargyt ýok.';
            return;
        }

        let html = '';
        let adminHtml = '';

        orders.forEach(o => {
            html += `<div class="order-item">
                <span><b>${o.player}</b> - ${o.item} (${o.price} TMT)</span>
                <button class="delete-btn" onclick="cancelOrder(${o.id})">Ýatyr (İptal)</button>
            </div>`;

            adminHtml += `<div class="order-item">
                <span>ID: ${o.id} | <b>${o.player}</b> -> ${o.item} (${o.price} TMT)</span>
                <button class="delete-btn" onclick="adminDeleteOrder(${o.id})">Poz (Sil)</button>
            </div>`;
        });

        listDiv.innerHTML = html;
        if(isAdmin) {
            adminListDiv.innerHTML = adminHtml;
        }
    }

    function adminLogin() {
        let pass = document.getElementById('admin-pass').value;
        // Admin açar sözüni bärden üýtgedip bilersiň (häzirki: admin123)
        if(pass === 'admin123') {
            isAdmin = true;
            document.getElementById('admin-login-box').style.display = 'none';
            document.getElementById('admin-panel-content').style.display = 'block';
            renderOrders();
        } else {
            alert('Ýalňyş parol!');
        }
    }

    function adminDeleteOrder(id) {
        orders = orders.filter(o => o.id !== id);
        saveOrders();
        renderOrders();
    }

    renderOrders();
</script>

</body>
</html>
